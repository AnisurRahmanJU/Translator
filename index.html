<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Translator - Anis Spoken English Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Hind+Siliguri:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/flag-icons/7.2.3/css/flag-icons.min.css" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0; background:#ffffff; padding:24px 12px; font-family:'Hind Siliguri','Baloo 2',sans-serif;}

  /* The poster itself, used as the literal background art */
  .poster-stage{
    position:relative;
    width:100%;
    max-width:900px;
    aspect-ratio:1/1;
    margin:0 auto;
    background-image:url('Translator.png');
    background-size:cover;
    background-position:center;
    border-radius:20px;
    overflow:visible;
    container-type:inline-size;
    box-shadow:0 10px 40px rgba(0,0,0,0.18);
    border:none;
  }

  /* Card region = the printed white/blue card, positioned by measured % of the poster */
  .card-hit{
    position:absolute;
    left:19.86%;
    top:31.34%;
    width:59.49%;
    height:44.10%;
  }
  .card-hit > *{position:absolute;}

  /* ---- language selects (redraw the flag+code chip so it stays live) ---- */
  .lang{
    top:16.4%; height:9%;
    display:flex; align-items:center; gap:2.2cqw;
    border-radius:1cqw;
    background:#eef6fd;
    padding:0 2cqw;
  }
  .lang.left{left:5.62%; width:40.7%;}
  .lang.right{left:53.28%; width:40.97%;}
  .lang .flag{font-size:3cqw; line-height:1; border-radius:2px; box-shadow:0 0 0 1px rgba(0,0,0,0.08);}
  .lang select{
    flex:1;
    border:none;
    background:transparent;
    font-family:'Hind Siliguri','Baloo 2',sans-serif;
    font-weight:600;
    color:#1c2b57;
    font-size:2.6cqw;
    appearance:none;
    cursor:pointer;
  }
  .lang select:focus{outline:none;}

  /* ---- input / output fields (solid patch to cover the printed demo text) ---- */
  .field-patch{
    top:30.2%; height:20.1%; left:5.62%; width:88.62%;
    border-radius:1.2cqw;
    background:#e9f6fe;
  }
  .field-patch.output{top:57.9%; height:18.5%; background:#e8f7ee;}

  .field-patch textarea{
    position:absolute; inset:0;
    width:100%; height:100%;
    border:none; background:transparent;
    resize:none;
    padding:2.6cqw 3cqw;
    font-family:'Hind Siliguri','Baloo 2',sans-serif;
    font-weight:600;
    font-size:2.5cqw;
    color:#152049;
    line-height:1.35;
  }
  .field-patch.output textarea{color:#123a24;}
  .field-patch textarea:focus{outline:none;}

  .counter{
    position:absolute; right:2.6cqw; bottom:1.6cqw;
    font-size:1.5cqw; color:#7183ab;
    background:#e9f6fe;
    padding:0 0.4cqw;
  }
  .copy-btn{
    position:absolute; top:1.8cqw; right:2cqw;
    width:6.2cqw; height:6.2cqw;
    border-radius:1.2cqw;
    border:none; cursor:pointer;
    background:#d9f0de; color:#1f7a3d;
    display:flex; align-items:center; justify-content:center;
    font-size:2.6cqw;
  }
  .copy-btn:active{transform:scale(0.94);}

  /* ---- buttons: printed art already shows the label/colour, just make them clickable ---- */
  .btn-hit{
    top:81.5%; height:11.3%;
    background:transparent;
    border:none;
    cursor:pointer;
  }
  .btn-hit.translate{left:5.22%; width:43.9%;}
  .btn-hit.clear{left:50.87%; width:43.9%;}

  /* ---- clickable header logo → website link ---- */
  .brand-link{
    position:absolute;
    left:11.96%; top:1.51%;
    width:63.48%; height:15.95%;
    display:block;
  }
</style>
</head>
<body>

  <div class="poster-stage">
    <a class="brand-link" href="https://anispokenenglish.wordpress.com" target="_blank" rel="noopener" title="Anis Spoken English Lab website"></a>
    <div class="card-hit" id="cardHit">

      <div class="lang left">
        <span class="flag fi fi-bd" id="flag1"></span>
        <select id="lang1"></select>
      </div>
      <div class="lang right">
        <span class="flag fi fi-gb" id="flag2"></span>
        <select id="lang2"></select>
      </div>

      <div class="field-patch input">
        <textarea id="user" maxlength="500" placeholder="Enter text for translation...">আমি ইংরেজি শিখতে চাই।</textarea>
        <span class="counter"><span id="count">20</span>/500</span>
      </div>

      <div class="field-patch output">
        <textarea id="output" readonly placeholder="Translated text will appear here...">I want to learn English.</textarea>
        <button class="copy-btn" id="copy" title="Copy"><i class="far fa-copy"></i></button>
      </div>

      <button class="btn-hit translate" id="translate" title="Translate"></button>
      <button class="btn-hit clear" id="clear" title="Clear"></button>

    </div>
  </div>

<script>
(function(){
  var langMeta = {
    en:{name:"EN (English)", flag:"fi-gb"},
    bn:{name:"BN (বাংলা)", flag:"fi-bd"},
    hi:{name:"HI (हिन्दी)", flag:"fi-in"},
    ar:{name:"AR (العربية)", flag:"fi-sa"}
  };
  var lang1 = document.getElementById('lang1');
  var lang2 = document.getElementById('lang2');
  var flag1 = document.getElementById('flag1');
  var flag2 = document.getElementById('flag2');
  var userInput = document.getElementById('user');
  var output = document.getElementById('output');
  var counter = document.getElementById('count');

  Object.keys(langMeta).forEach(function(code){
    var o1 = document.createElement('option'); o1.value = code; o1.textContent = langMeta[code].name;
    var o2 = document.createElement('option'); o2.value = code; o2.textContent = langMeta[code].name;
    lang1.appendChild(o1); lang2.appendChild(o2);
  });
  lang1.value = 'bn';
  lang2.value = 'en';

  function syncFlags(){
    flag1.className = 'flag fi ' + langMeta[lang1.value].flag;
    flag2.className = 'flag fi ' + langMeta[lang2.value].flag;
  }
  syncFlags();
  lang1.addEventListener('change', syncFlags);
  lang2.addEventListener('change', syncFlags);

  counter.textContent = userInput.value.length;
  userInput.addEventListener('input', function(){
    counter.textContent = userInput.value.length;
  });

  function translate(){
    var text = userInput.value.trim();
    if(!text) return;
    var url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=" +
      lang1.value + "&tl=" + lang2.value + "&dt=t&q=" + encodeURIComponent(text);

    output.value = "Translating...";
    fetch(url)
      .then(function(r){ return r.json(); })
      .then(function(data){
        var translated = data[0].map(function(seg){ return seg[0]; }).join('');
        output.value = translated;
      })
      .catch(function(){
        output.value = "Translation failed. Please check your connection and try again.";
      });
  }

  document.getElementById('translate').addEventListener('click', translate);
  document.getElementById('clear').addEventListener('click', function(){
    userInput.value = '';
    output.value = '';
    counter.textContent = '0';
  });
  document.getElementById('copy').addEventListener('click', function(){
    if(!output.value) return;
    navigator.clipboard.writeText(output.value);
  });
})();
</script>

</body>
</html>
